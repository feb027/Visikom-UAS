[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visikom-dr"
version = "0.1.0"
description = "Modul Visi Komputer dan Deep Learning untuk klasifikasi retinopati diabetik pada dataset APTOS 2019."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "opencv-python>=4.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "timm>=1.0",
  "albumentations>=1.4",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "grad-cam>=1.5",
  "onnx>=1.16",
]
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "onnxruntime-directml>=1.19",
]

[tool.setuptools.packages.find]
where = ["src"]
