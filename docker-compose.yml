services:
  mydria:
    build:
      context: .
      dockerfile: Dockerfile
    image: mydria-app:latest
    ports:
      - "8000:7860"
    environment:
      MYDRIA_HOST: "0.0.0.0"
      PORT: "7860"
    volumes:
      - mydria_models:/app/models
      - mydria_outputs:/app/outputs
    restart: unless-stopped

volumes:
  mydria_models:
  mydria_outputs:
