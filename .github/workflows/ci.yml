name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-docs:
    name: Docs Validator & Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install dependencies (CPU PyTorch + Serve)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve]"
          pip install timm albumentations scikit-learn scipy grad-cam onnx httpx

      - name: Validate documentation & links
        run: python scripts/validate_docs.py

      - name: Run unit & FastAPI integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend Typecheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Mydria PWA
        working-directory: frontend
        run: |
          npm ci
          npm run build
